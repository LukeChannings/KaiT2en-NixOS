---
# The KaiT2en-NixOS build gate.
#
# `just test` builds the flake's `checks` — every package (patched kernel,
# every out-of-tree module, every app) plus the three per-profile NixOS
# toplevels — so a green run proves the whole stack still builds. That is the
# gate the sync-upstream skill relies on.
#
# The realised closures are then pushed to the niks3 binary cache at
# https://nix.channings.me, so hardware smoke tests and consumers
# (hartlandia) substitute instead of rebuilding: a sync-PR kernel is built
# once, here. `just test` keeps going past a failing target and links
# everything that did build, so even a failed gate caches the multi-hour
# kernel and the fix-up run does not rebuild it.
name: Test

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build gate
    # The kernel and every module are x86_64-linux. The runner need not be
    # x86_64 itself, only able to build for it: `snowman` carries this label
    # from macOS and routes the derivations to its linux-builder, which
    # offers x86_64-linux through Rosetta.
    runs-on: nixos-latest-x86_64
    timeout-minutes: 360
    steps:
      - name: Checkout
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          TOKEN: ${{ github.token }}
        run: >-
          git clone --depth 1 -b "${HEAD_REF:-$REF_NAME}"
          "https://$TOKEN@forge.channings.me/$GITHUB_REPOSITORY.git" .
      # yamllint disable-line rule:line-length
      - uses: https://forge.channings.me/hartlandia/nixham/.forgejo/actions/setup-nix-shell@main
      - name: Build gate
        run: just test
      # A failed gate still leaves every target it did realise linked as
      # ./result-N, so the push below caches them — above all the multi-hour
      # kernel. When it realised nothing there is nothing to push, and
      # niks3-push treats an unmatched ./result* glob as a fatal error, which
      # would bury the gate's real failure under a misleading
      # "path does not exist".
      # POSIX glob test, not `compgen -G`: the runner executes this with sh,
      # where compgen does not exist. It failed open to "nothing realised",
      # which would have skipped the push even on a good build.
      - name: Check for realised paths
        id: realised
        if: '!cancelled()'
        run: |
          set -- ./result*
          if [ -e "$1" ] || [ -L "$1" ]; then
            echo 'any=true' >> "$GITHUB_OUTPUT"
            echo "realised $# path(s) to push"
          else
            echo 'any=false' >> "$GITHUB_OUTPUT"
            echo 'nothing was realised; skipping the cache push'
          fi
      # Fork PRs get no secrets.
      - name: Push to nix.channings.me
        if: >-
          !cancelled()
          && steps.realised.outputs.any == 'true'
          && (github.event_name == 'push'
          || github.event.pull_request.head.repo.full_name == github.repository)
        # yamllint disable-line rule:line-length
        uses: https://forge.channings.me/hartlandia/nixham/.forgejo/actions/niks3-push@main
        with:
          token: ${{ secrets.NIKS3_CI_TOKEN }}
          paths: ./result*
