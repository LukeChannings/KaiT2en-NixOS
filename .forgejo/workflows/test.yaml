---
# The KaiT2en-NixOS build gate.
#
# `just test` builds the flake's `checks` — every package (patched kernel,
# every out-of-tree module, every app) plus the three per-profile NixOS
# toplevels — so a green run proves the whole stack still builds.
#
# The realised closures are then pushed to the niks3 binary cache at
# https://nix.channings.me, so hardware smoke tests and consumers
# (hartlandia) substitute instead of rebuilding: a sync-PR kernel is built
# once, here. `just test` keeps going past a failing target and links
# everything that did build, so even a failed gate caches the multi-hour
# kernel and the fix-up run does not rebuild it.
name: Test

"on":
  push:
    branches: [main]
  pull_request:

# A gate run is hours of kernel. Never let two stack up on the same ref;
# the newest push is the only one whose result anyone wants. (The old
# .github/workflows/nix.yml had this and it was lost in the move here.)
concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build gate
    # The kernel and every module are x86_64-linux. The runner need not be
    # x86_64 itself, only able to build for it: `snowman` carries this label
    # from macOS and routes the derivations to its linux-builder, which
    # offers x86_64-linux through Rosetta.
    runs-on: nixos-latest-x86_64
    timeout-minutes: 360
    steps:
      # The link to the forge drops streams -- hartlandia's build.yaml
      # retries its LFS pull for exactly this reason. Run 10 of this
      # workflow stalled mid-clone for ten minutes and then died with
      # "RPC failed; curl 56 Recv failure: Can't assign requested address",
      # failing the gate before a single derivation was built.
      #
      # lowSpeedLimit/lowSpeedTime abort a transfer that has stalled for a
      # minute, so a dead stream is retried promptly instead of hanging
      # until the RPC collapses ten minutes later.
      #
      # This step runs BEFORE setup-nix-shell, so it has only the host-exec
      # runner's static PATH (hartlandia's lib/ci-toolchain.nix) -- coreutils
      # but no findutils. Hence POSIX globs rather than `find`, which died
      # here with exit 127. Everything after setup-nix-shell has the
      # devshell's PATH and is not so constrained.
      #
      # Fetches github.ref rather than `clone -b <branch>`: on a pull_request
      # that is refs/pull/N/head, which exists for every PR -- same-repo,
      # fork, or AGit (`git push origin HEAD:refs/for/main`). An AGit PR has
      # no source branch on the forge, so github.head_ref is the bare
      # "refs/pull/N/head", which `clone -b` rejects. Fetching from a URL
      # instead of adding a remote also keeps the token out of .git/config.
      - name: Checkout
        env:
          REF: ${{ github.ref }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://$TOKEN@forge.channings.me/$GITHUB_REPOSITORY.git"
          for i in 1 2 3; do
            rm -rf -- ..?* .[!.]* *
            if git init -q . \
               && git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 \
                    fetch --depth 1 --no-tags "$url" "$REF" \
               && git checkout -q --detach FETCH_HEAD; then
              exit 0
            fi
            echo "::warning::clone failed (attempt $i/3)" >&2
            sleep $((i * 10))
          done
          echo "::error::could not clone the repo after 3 attempts" >&2
          exit 1
      # yamllint disable-line rule:line-length
      - uses: https://forge.channings.me/hartlandia/nixham/.forgejo/actions/setup-nix-shell@main
      - name: Build gate
        run: just test
      # A failed gate still leaves every target it did realise linked as
      # ./result-N, so the push below caches them — above all the multi-hour
      # kernel. When it realised nothing there is nothing to push, and
      # niks3-push treats an unmatched ./result* glob as a fatal error, which
      # would bury the gate's real failure under a misleading
      # "path does not exist".
      # POSIX glob test, not `compgen -G`: the runner executes this with sh,
      # where compgen does not exist. It failed open to "nothing realised",
      # which would have skipped the push even on a good build.
      - name: Check for realised paths
        id: realised
        if: '!cancelled()'
        run: |
          set -- ./result*
          if [ -e "$1" ] || [ -L "$1" ]; then
            echo 'any=true' >> "$GITHUB_OUTPUT"
            echo "realised $# path(s) to push"
          else
            echo 'any=false' >> "$GITHUB_OUTPUT"
            echo 'nothing was realised; skipping the cache push'
          fi
      # Fork PRs get no secrets.
      - name: Push to nix.channings.me
        if: >-
          !cancelled()
          && steps.realised.outputs.any == 'true'
          && (github.event_name == 'push'
          || github.event.pull_request.head.repo.full_name == github.repository)
        # yamllint disable-line rule:line-length
        uses: https://forge.channings.me/hartlandia/nixham/.forgejo/actions/niks3-push@main
        with:
          token: ${{ secrets.NIKS3_CI_TOKEN }}
          paths: ./result*
