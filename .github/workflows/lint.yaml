---
# Mirror-side lint. The build gate itself runs on the forge
# (.forgejo/workflows/test.yaml), on self-hosted runners with the disk and
# time a kernel build needs; this is the cheap check that is still worth
# having on the GitHub mirror.
#
# Forgejo ignores .github/workflows entirely when .forgejo/workflows exists,
# so nothing here runs twice on the forge.
name: Lint

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa  # v23
        with:
          determinate: false
      - uses: lukechannings/nixham/.forgejo/actions/substituter@main
      - uses: lukechannings/nixham/.forgejo/actions/setup-nix-shell@main
      - name: Lint
        run: just lint
