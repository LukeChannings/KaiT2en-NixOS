# KaiT2en-NixOS build gate + binary cache push.
#
# This is OUR workflow (the NixOS fork's); the sibling workflows in this
# directory (kernel-copr, installer, pages, discord) are inherited from
# upstream KaiT2en-Fedora, are Fedora-specific, and are kept disabled in the
# repo settings rather than deleted so upstream merges never conflict here.
#
# What it does:
#   * PRs + pushes to main: `nix-build` the three per-profile NixOS
#     configurations' toplevels — the complete build gate. Each toplevel
#     pulls in the whole stack (patched kernel, every out-of-tree module,
#     every app; see `nixosConfigurations` in flake.nix), so building them
#     proves the stack still builds.
#   * Then pushes the built toplevels (and their closures) to the niks3
#     binary cache at https://nix.channings.me so hardware smoke tests and
#     consumers (hartlandia) substitute instead of rebuilding — a sync-PR
#     kernel is built once, here. The kernel's `dev` output is pushed too:
#     it is build-time only, so no toplevel closure carries it, yet any
#     consumer building an extra out-of-tree module (e.g. ZFS) needs it.
#
# Secrets:
#   NIKS3_CI_TOKEN — the Kanidm CI service-account API token. The push step
#   exchanges it (RFC 8693) at id.channings.me for a short-lived aud=niks3
#   OIDC token; niks3 grants it write scope and signs server-side, so no
#   client signing key is needed (ADR-0010). A static niks3 token is NOT used
#   — it expires and 401s. Must be a member of the niks3_ci Kanidm group.
name: nix

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: nix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build NixOS
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes back to the repo; don't leave the token on disk.
          persist-credentials: false

      # Kernel builds need tens of GB; the hosted runner's / has ~14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      # The public key can't be wrapped inside nix.conf.
      # yamllint disable rule:line-length
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            extra-substituters = https://nix.channings.me
            extra-trusted-public-keys = garage:JZet/fsItH8cJ6SKLci1+BuMIQGDfZSa/8GxGpKcxss=
      # yamllint enable rule:line-length

      - name: Build gate (nix-build nixosConfigurations)
        # Enumerate the per-profile configs from the flake, then nix-build
        # each toplevel (via the default.nix flake-compat shim), plus the
        # kernel's dev output. The store paths land in
        # $RUNNER_TEMP/nixos-paths for the push step.
        run: |
          mapfile -t names < <(nix eval --json '.#nixosConfigurations' \
            --apply builtins.attrNames | nix run nixpkgs#jq -- -r '.[]')
          args=(-A packages.x86_64-linux.kernel.dev)
          for name in "${names[@]}"; do
            attr="nixosConfigurations.${name}.config.system.build.toplevel"
            args+=(-A "$attr")
          done
          nix-build --no-out-link "${args[@]}" | tee "$RUNNER_TEMP/nixos-paths"

      # The refresher heredoc carries an irreducible OIDC URN and jq filter.
      # yamllint disable rule:line-length
      - name: Push to cache
        # Pushes on PRs too, so the sync-branch kernel is cached before the
        # hardware smoke test. Push the built toplevels; niks3 walks and
        # uploads their full closures. Verify the client invocation against
        # the deployed niks3 version if this step fails.
        if: >-
          ${{ github.event.pull_request.head.repo.full_name == github.repository
          || github.event_name == 'push' }}
        env:
          # Per ADR-0010, CI authenticates to niks3 via OIDC: a long-lived
          # Kanidm service-account token, exchanged (RFC 8693) for a
          # short-lived aud=niks3 access token. A static niks3 token was
          # deliberately rejected there — it expires (~15m) and then silently
          # 401s. The refresher below re-mints on demand via
          # --auth-token-script, so a build that outlasts one token still
          # pushes.
          NIKS3_CI_TOKEN: ${{ secrets.NIKS3_CI_TOKEN }}
        run: |
          if [ -z "$NIKS3_CI_TOKEN" ]; then
            echo "::error::NIKS3_CI_TOKEN secret is empty or not set"
            exit 1
          fi
          mapfile -t paths < "$RUNNER_TEMP/nixos-paths"
          # Seed the Kanidm CI token + a refresher that exchanges it (RFC 8693)
          # at the Kanidm token endpoint for an aud=niks3 OIDC token. niks3's
          # provider grants `write` to any aud=niks3 token, and only niks3_ci
          # group members can mint one. The emitted JSON ({token, expires_at})
          # is niks3's auth-token-script contract; expires_at lets it cache
          # until 75% of the token's life, then re-mint.
          install -d -m 700 "$HOME/.config/niks3"
          umask 077
          printf '%s' "$NIKS3_CI_TOKEN" > "$HOME/.config/niks3/ci-token"
          cat > "$HOME/.config/niks3/refresh-token" <<'SCRIPT'
          set -euo pipefail
          resp=$(curl -fsS -X POST "https://id.channings.me/oauth2/token" \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d audience=niks3 \
            -d scope=openid \
            -d subject_token_type=urn:ietf:params:oauth:token-type:access_token \
            -d client_id=niks3 \
            --data-urlencode subject_token@"$HOME/.config/niks3/ci-token")
          printf '%s' "$resp" | jq -e 'if .access_token then {token: .access_token, expires_at: (now + (.expires_in // 900) | todate)} else error("niks3 token exchange returned no access_token") end'
          SCRIPT
          # niks3 shell-splits --auth-token-script and execs argv[0] directly,
          # so pass this step's bash ($BASH, absolute) as the interpreter for
          # the shebang-less refresher. jq (used by the refresher) is put on
          # PATH via `nix shell`; curl is already present on the runner.
          nix shell nixpkgs#jq --command \
            nix run github:Mic92/niks3 -- push \
              --server-url https://niks3.nix.channings.me \
              --auth-token-script "$BASH $HOME/.config/niks3/refresh-token" \
              "${paths[@]}"
      # yamllint enable rule:line-length
