[package]
name = "t2-debug"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Live Apple T2 (bridgeOS) debugger over the Instruments dtservicehub"

[lib]
name = "t2_debug"
path = "src/lib.rs"

[[bin]]
name = "t2-debug"
path = "src/bin/t2-debug.rs"
required-features = ["gui"]

[[bin]]
name = "t2debug"
path = "src/bin/t2debug.rs"

[features]
default = ["gui"]
gui = ["dep:gtk4", "dep:adw", "dep:glib"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
plist = "1.7"
regex = "1.11"
serde_json = "1.0"
socket2 = { version = "0.6", features = ["all"] }
t2-bridgexpc = { path = "../../t2-services/shared/protocols/t2-bridgexpc" }

gtk4 = { version = "0.9", features = ["v4_12"], optional = true }
adw = { package = "libadwaita", version = "0.7", optional = true }
glib = { version = "0.20", optional = true }
