SectionVerb {
	Value {
		TQ "HiFi"
	}
}

# Keep the separate T2 PCMs instantiated across jack changes. JackControl and
# the per-device priorities select the preferred endpoint without destroying
# the speaker/mic nodes and their attached DSP filters.

SectionDevice."Speaker" {
	Comment "Internal Speakers"

	Value {
		PlaybackPriority 100
		PlaybackChannels 4
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	Value {
		CapturePriority 300
		CaptureRate 48000
		CapturePCM "hw:${CardId},1"
	}

	# The 4-channel MacBooks have three microphones, the iMacPro1,1 has four.
	# A channel count the PCM rejects drops the whole HiFi profile.
	If.mics {
		Condition {
			Type RegexMatch
			Regex "^iMacPro1,1"
			String "${sys:class/dmi/id/product_name}"
		}
		True.Value.CaptureChannels 4
		False.Value.CaptureChannels 3
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	Value {
		PlaybackPriority 300
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},2"
		JackControl "Codec Output Jack"
	}
}
