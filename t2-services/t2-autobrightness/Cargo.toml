[package]
name = "t2-autobrightness"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Automatic display brightness for T2 Intel Macs that follows the macOS behaviour"

[dependencies]
anyhow = "1.0"
libc = "0.2"
zbus = "5"

[[bin]]
name = "t2-autobrightness"
path = "daemon/main.rs"
